<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eid Mubarak</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  background: black;
  overflow: hidden;
}

/* Background Image */
.bg {
  position: fixed;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* Content */
.container {
  text-align: center;
  color: white;
}

/* Eid PNG */
.eid-img {
  width: 300px;
  margin-bottom: 20px;
}

/* Name style */
.name {
  font-size: 40px;
  font-weight: bold;
  color: gold;
  text-shadow: 0 0 20px gold;
}
</style>
</head>

<body>

<!-- Your Eid PNG -->
<video autoplay muted loop id="bg-video">
  <source src="your-video.mp4" type="video/mp4">
</video>
<div class="container">
  <!-- Optional Eid text image -->
  <img autoplay src="your-eid-text.png" class="eid-img">
<!-- 🔊 Audio -->
<audio  id="music" src="your-audio.mp3"></audio>
  <div class="name" id="username"></div>
</div>

<script>
/* Get name from URL */
const params = new URLSearchParams(window.location.search);
const name = params.get("name");

/* Show name */
document.getElementById("username").innerText = name;
</script>

</body>
</html>
