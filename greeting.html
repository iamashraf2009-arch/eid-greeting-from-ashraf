<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Maria 🎉</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff9ec4,#ffd6ec,#ffeef8);
      overflow:hidden;
    }

    .card{
      width:90%;
      max-width:500px;
      background:rgba(255,255,255,.95);
      padding:40px;
      border-radius:20px;
      text-align:center;
      box-shadow:0 15px 35px rgba(0,0,0,.2);
      animation:pop .8s ease;
      z-index:10;
    }

    h1{
      color:#ff2d75;
      font-size:2.6rem;
      margin-bottom:10px;
    }

    h2{
      color:#444;
      margin-bottom:20px;
    }

    p{
      color:#666;
      font-size:18px;
      line-height:1.6;
      margin-bottom:20px;
    }

    .quote{
      margin:25px 0;
      padding:18px;
      border-radius:15px;
      background:#fff0f6;
      color:#d81b60;
      font-size:22px;
      font-weight:bold;
      border:2px dashed #ff7eb3;
    }

    button{
      padding:14px 30px;
      font-size:17px;
      border:none;
      border-radius:30px;
      background:#ff2d75;
      color:white;
      cursor:pointer;
      transition:.3s;
    }

    button:hover{
      transform:scale(1.08);
      background:#e6005c;
    }

    .confetti{
      position:absolute;
      width:12px;
      height:12px;
      top:-20px;
      animation:fall linear forwards;
    }

    @keyframes fall{
      to{
        transform:translateY(110vh) rotate(720deg);
      }
    }

    @keyframes pop{
      from{
        transform:scale(.5);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }
  </style>
</head>

<body>

<div class="card">
  <h1>🎂 Happy Birthday 🎂</h1>
  <h2>Maria ❤️</h2>

  <p>
    Wishing you a day filled with happiness, laughter,
    love, and unforgettable memories.
    Have an amazing birthday! 🌸✨
  </p>

  <div class="quote">
    💢 "লুচ্চা বেডি! 😠 Where were you last night?!" 💢
  </div>

  <button onclick="celebrate()">🎉 Celebrate 🎉</button>
</div>

<script>
function celebrate(){

  alert("🎉 Happy Birthday Maria! ❤️ Have an awesome day!");

  for(let i=0;i<150;i++){

    const c=document.createElement("div");
    c.className="confetti";

    c.style.left=Math.random()*window.innerWidth+"px";
    c.style.background=`hsl(${Math.random()*360},100%,50%)`;
    c.style.animationDuration=(2+Math.random()*3)+"s";

    document.body.appendChild(c);

    setTimeout(()=>c.remove(),5000);
  }
}
</script>

</body>
</html>
