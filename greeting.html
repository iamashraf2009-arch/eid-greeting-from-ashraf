<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eid Mubarak</title>

<style>
body {
  margin: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Segoe UI', sans-serif;
  overflow: hidden;
}

/* 🎥 Background Video */
#bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -1;
}

/* 📦 Content */
.container {
  text-align: center;
  color: white;
  z-index: 1;
}

/* 🖼️ Eid PNG */
.eid-img {
  width: 500px;
  display: block;
  margin: 0 auto 5px auto; /* 🔽 reduced gap */
}

/* 🧑 Name */
.name {
  font-size: 40px;
  font-weight: bold;
  color: gold;
  text-shadow: 0 0 20px gold;
  margin-top: -5px; /* 🔼 pulls name closer */
}
</style>
</head>

<body>

<!-- 🎥 Background Video -->
<video autoplay muted loop id="bg-video">
  <source src="your-video.mp4" type="video/mp4">
</video>

<!-- 📦 Content -->
<div class="container">
  
  <!-- 🖼️ PNG -->
  <img src="your-eid-text.png" class="eid-img">

  <!-- 🔊 Audio -->
  <audio id="music" src="your-audio.mp3" autoplay loop></audio>
  <script>
const music = document.getElementById("music");

document.body.addEventListener("click", () => {
  music.play();
}, { once: true });
</script>

  <!-- 🧑 Name -->
  <div class="name" id="username"></div>

</div>

<script>
/* Get name from URL */
const params = new URLSearchParams(window.location.search);
const name = params.get("name");

/* Show name */
document.getElementById("username").innerText = name || "Eid Mubarak";
</script>

</body>
</html>
